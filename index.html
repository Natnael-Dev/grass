<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>grass — a tiny meadow for a one-minute break</title>
    <meta
      name="description"
      content="a calm interactive meadow in your browser. brush the grass, scatter seeds, lie down. no account, no tracking."
    />
    <meta name="theme-color" content="#101b4a" />
    <style>
      :root {
        --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
        --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --text: #f4f1e8;
        --text-muted: #cfcdc2;
        --accent: #c5f277;
        --accent-ink: #10200c;
        --panel: rgba(10, 14, 28, 0.58);
        --panel-solid: rgba(10, 14, 28, 0.88);
        --focus: #ffe08a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0c142b;
        color: var(--text);
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .vignette-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      body.lying .hud,
      body.lying #entry-overlay {
        opacity: 0.35;
        transition: opacity 1.1s cubic-bezier(0.22, 0.8, 0.2, 1);
      }
      .entry-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          circle at center,
          rgba(10, 14, 28, 0.65) 0%,
          rgba(6, 11, 36, 0.92) 100%
        );
        z-index: 100;
        transition: opacity 0.9s cubic-bezier(0.22, 0.8, 0.2, 1);
        padding: 24px;
        text-align: center;
      }
      .entry-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .entry-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        max-width: 480px;
      }
      .entry-wordmark {
        font-family: var(--font-mono);
        font-size: clamp(48px, 9vw, 96px);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text);
        line-height: 1;
      }
      .cursor-blink {
        animation: blink 1.1s step-end infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cursor-blink {
          animation: none;
          opacity: 1;
        }
      }
      .entry-tagline {
        font-size: 18px;
        color: var(--text-muted);
        line-height: 1.4;
      }
      .btn-enter {
        margin-top: 12px;
        height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-family: var(--font-mono);
        font-size: 15px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 160ms ease,
          background-color 160ms ease,
          opacity 160ms ease;
      }
      .btn-enter:hover:not(:disabled) {
        transform: translateY(-1px);
        background-color: #d2f78e;
      }
      .btn-enter:active:not(:disabled) {
        transform: scale(0.97);
      }
      .btn-enter:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      .btn-enter:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .entry-note {
        font-size: 12px;
        color: var(--text-muted);
      }
      .noscript-banner {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel-solid);
        color: var(--text);
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 14px;
        font-family: var(--font-mono);
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-hidden="true"></canvas>
      <div id="entry-overlay" class="entry-overlay">
        <div class="entry-content">
          <h1 class="entry-wordmark">grass<span class="cursor-blink">_</span></h1>
          <p class="entry-tagline">go outside for a minute. your build will wait.</p>
          <button id="btn-enter" class="btn-enter" type="button" autofocus>step outside</button>
          <p class="entry-note">sound starts when you click.</p>
        </div>
      </div>
    </div>
    <noscript>
      <div class="noscript-banner">grass needs javascript. the real grass doesn't, though.</div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
